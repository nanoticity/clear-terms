<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="header">
    <h1>Clear Terms</h1>
    <p class="subtitle">Privacy Policy Analyzer</p>
  </div>

  <div id="status" class="status">
    <div class="spinner"></div>
    <span id="status-text">Looking for privacy policy...</span>
  </div>

  <div id="error" class="error" hidden>
    <p id="error-message"></p>
  </div>

  <div id="results" hidden>
    <div class="summary">
      <div class="summary-item">
        <span class="summary-label">Clauses found</span>
        <span id="total-clauses" class="summary-value">0</span>
      </div>
      <div class="summary-item">
        <span class="summary-label">Grade</span>
        <span id="grade" class="summary-value badge">—</span>
      </div>
    </div>

    <a id="policy-link" class="policy-link" href="#" target="_blank" hidden>View privacy policy</a>

    <h2>Breakdown</h2>
    <div class="bars">
      <div class="bar-row">
        <span class="bar-label">Good</span>
        <div class="bar-track"><div id="bar-good" class="bar-fill good"></div></div>
        <span id="count-good" class="bar-count">0</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Neutral</span>
        <div class="bar-track"><div id="bar-neutral" class="bar-fill neutral"></div></div>
        <span id="count-neutral" class="bar-count">0</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Bad</span>
        <div class="bar-track"><div id="bar-bad" class="bar-fill bad"></div></div>
        <span id="count-bad" class="bar-count">0</span>
      </div>
      <div class="bar-row">
        <span class="bar-label">Blocker</span>
        <div class="bar-track"><div id="bar-blocker" class="bar-fill blocker"></div></div>
        <span id="count-blocker" class="bar-count">0</span>
      </div>
    </div>

    <div id="samples-section" hidden>
      <h2>Problematic Clauses</h2>
      <div id="sample-clauses"></div>
    </div>
  </div>

  <script src="classifier.js"></script>
  <script src="clauses.js"></script>
  <script src="analyzer.js"></script>
  <script src="popup.js"></script>
</body>
</html>
