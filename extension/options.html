<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Clear Terms — Settings</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      width: auto;
      max-height: none;
      overflow-y: auto;
      min-height: 100vh;
    }

    .options-wrap {
      max-width: 480px;
      margin: 40px auto;
      padding: 0 20px 40px;
    }

    .options-wrap .header {
      border-bottom: none;
      padding: 0 0 20px;
    }

    .section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 16px;
    }

    .section-title {
      font-size: 13px;
      font-weight: 600;
      color: #e6edf3;
      margin-bottom: 12px;
    }

    .radio-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .radio-option {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      cursor: pointer;
    }

    .radio-option input[type="radio"] {
      margin-top: 3px;
      accent-color: var(--accent);
    }

    .radio-label {
      font-size: 14px;
      color: var(--text);
    }

    .radio-desc {
      font-size: 12px;
      color: var(--text-dim);
      margin-top: 2px;
    }

    .api-key-section {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
    }

    .api-key-section label {
      display: block;
      font-size: 12px;
      color: var(--text-dim);
      margin-bottom: 6px;
    }

    .api-key-section input[type="password"] {
      width: 100%;
      padding: 8px 10px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      font-family: monospace;
      outline: none;
    }

    .api-key-section input[type="password"]:focus {
      border-color: var(--accent);
    }

    .save-btn {
      display: block;
      width: 100%;
      padding: 10px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
    }

    .save-btn:hover {
      background: var(--accent-light);
    }

    .save-status {
      text-align: center;
      font-size: 13px;
      margin-top: 10px;
      color: var(--good);
      min-height: 20px;
    }

    .save-status.error {
      color: var(--blocker);
    }
  </style>
</head>
<body>
  <div class="options-wrap">
    <div class="header">
      <h1>Clear Terms</h1>
      <p class="subtitle">Settings</p>
    </div>

    <div class="section">
      <div class="section-title">Analysis Mode</div>
      <div class="radio-group">
        <label class="radio-option">
          <input type="radio" name="mode" value="openai" id="mode-openai">
          <div>
            <div class="radio-label">OpenAI API (recommended)</div>
            <div class="radio-desc">Uses GPT-4.1-nano for accurate, context-aware analysis. Requires your own API key.</div>
          </div>
        </label>
        <label class="radio-option">
          <input type="radio" name="mode" value="local" id="mode-local">
          <div>
            <div class="radio-label">Built-in Model (offline)</div>
            <div class="radio-desc">Runs entirely in your browser using a lightweight ML model. No API key needed, but less accurate than OpenAI.</div>
          </div>
        </label>
      </div>

      <div id="api-key-section" class="api-key-section" hidden>
        <label for="api-key">OpenAI API Key</label>
        <input type="password" id="api-key" placeholder="sk-...">
      </div>
    </div>

    <button id="save-btn" class="save-btn">Save Settings</button>
    <div id="save-status" class="save-status"></div>
  </div>

  <script src="options.js"></script>
</body>
</html>
