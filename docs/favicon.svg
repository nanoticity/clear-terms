<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Dark ocean background -->
  <rect width="32" height="32" rx="7" fill="#0b1929"/>
  <!-- Water shimmer at bottom -->
  <rect x="0" y="22" width="32" height="10" rx="3" fill="#0d2035" opacity="0.6"/>
  <!-- Magnifying glass circle -->
  <circle cx="14" cy="14" r="8" fill="none" stroke="#58a6b1" stroke-width="2.2"/>
  <!-- Inner highlight on lens -->
  <circle cx="14" cy="14" r="8" fill="url(#lensGlow)" opacity="0.15"/>
  <!-- CT lettermark inside lens -->
  <!-- C -->
  <path d="M11 12 Q9.5 14 11 16" stroke="#7ec8d3" stroke-width="1.6" fill="none" stroke-linecap="round"/>
  <!-- T vertical -->
  <line x1="15" y1="11.5" x2="15" y2="16.5" stroke="#7ec8d3" stroke-width="1.6" stroke-linecap="round"/>
  <!-- T crossbar -->
  <line x1="13" y1="11.5" x2="17" y2="11.5" stroke="#7ec8d3" stroke-width="1.6" stroke-linecap="round"/>
  <!-- Magnifying glass handle -->
  <line x1="20" y1="20" x2="24" y2="24" stroke="#58a6b1" stroke-width="2.4" stroke-linecap="round"/>
  <!-- Small dot accent (like a bubble) -->
  <circle cx="6" cy="6" r="1.2" fill="#3fb68b" opacity="0.7"/>
  <defs>
    <radialGradient id="lensGlow" cx="40%" cy="35%">
      <stop offset="0%" stop-color="#7ec8d3"/>
      <stop offset="100%" stop-color="transparent"/>
    </radialGradient>
  </defs>
</svg>
